[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-toolkit"
version = "1.0.0"
description = "Attack surface & OSINT recon toolkit for authorized assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "python-whois>=0.9.4",
    "dnspython>=2.4.2",
    "shodan>=1.31.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
